name: Publish OrbitPet release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the tagged application
        run: |
          git init --quiet
          git fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF:$GITHUB_REF"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git checkout --quiet --detach "$GITHUB_REF"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "VERSION = '${GITHUB_REF_NAME#v}'" app.py
          git for-each-ref --format='%(contents)' "$GITHUB_REF" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish the tested Windows executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OrbitPet.exe \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Orbit ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
